version: '3.8'

services:
  api:
    build: .
    container_name: store_intelligence_api
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database between restarts
      - db_data:/store-intelligence/store_intelligence.db
      # Mount POS CSV so API can auto-import it on startup
      - ./pos_transactions.csv:/store-intelligence/pos_transactions.csv:ro
    environment:
      - POS_CSV_PATH=/store-intelligence/pos_transactions.csv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
